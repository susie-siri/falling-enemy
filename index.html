<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maze Adventure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="screen home">
  <h1>Maze Adventure</h1>
  <button id="playBtn">PLAY</button>
</div>

<div class="screen characters hidden">
  <h2>Choose Character</h2>
  <div class="cards">
    <img src="images/duck.png" class="card">
    <img src="images/fan.png" class="card">
    <img src="images/fire.png" class="card">
    <img src="images/nan.png" class="card">
    <img src="images/joshy.png" class="card">
  </div>
</div>

<div class="screen themes hidden">
  <h2>Choose Theme</h2>
  <button class="themeBtn" data-theme="tech">🧠 Tech</button>
  <button class="themeBtn" data-theme="forest">🌲 Forest</button>
  <button class="themeBtn" data-theme="dungeon">🏰 Dungeon</button>
  <button class="themeBtn" data-theme="space">🚀 Space</button>
</div>

<div class="screen game hidden">
  <div class="hud">
    <span id="status">Reach the goal 🟨</span>
    <button id="pauseBtn">⏸</button>
  </div>

  <div class="game-area">
    <img id="player">
    <div id="enemy"></div>
    <div id="goal"></div>

    <div class="wall" style="left:0;top:0;width:320px;height:15px;"></div>
    <div class="wall" style="left:0;top:0;width:15px;height:420px;"></div>
    <div class="wall" style="left:305px;top:0;width:15px;height:420px;"></div>
    <div class="wall" style="left:0;top:405px;width:320px;height:15px;"></div>
  </div>

  <div id="pauseMenu" class="overlay hidden">
    <h2>Paused</h2>
    <button id="resumeBtn">Resume</button>
    <button id="backBtn">Back</button>
  </div>

  <div id="endMenu" class="overlay hidden">
    <h2 id="endText"></h2>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
